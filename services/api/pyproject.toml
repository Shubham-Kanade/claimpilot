[project]
name = "claimpilot"
version = "0.1.0"
description = "ClaimPilot API: AI expense & reimbursement agent (FastAPI modular monolith + Arq worker)"
readme = "README.md"
authors = [{ name = "Shubham Kanade" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pillow>=11",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
c2pa = [
    "c2pa-python>=0.38.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.14.0",
    "ruff>=0.16.10",
    "syrupy>=6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: makes real (paid) LLM/Jev calls; skipped unless LLM_MODE=live"]
addopts = "-ra"

[tool.coverage.run]
source = ["claimpilot"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ migrations dir is not a first-party package

[tool.pyright]
include = ["src", "tests", "alembic"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
