name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No secrets in this workflow: LLM calls run in fake/replay mode only (ADR-005).
env:
  LLM_MODE: replay

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests + coverage gate (fail_under in pyproject)
        run: uv run pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            services/api/coverage.xml
            services/api/junit.xml
      - name: OpenAPI drift
        run: |
          uv run python -m claimpilot.export_openapi > /tmp/openapi.json
          diff -u ../../apps/web/openapi.json /tmp/openapi.json || {
            echo "::error::apps/web/openapi.json is stale. Run the api-contract skill steps and commit."; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types up to date
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Tests + coverage gate (thresholds in vitest.config.mts)
        run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/

  synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/synth
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (browser render tests skip when no browser is installed)
        run: uv run pytest -q

  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [mcp-finance, mcp-corp]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests + coverage gate (fail_under in pyproject)
        run: uv run pytest --cov --cov-report=term

  docker:
    runs-on: ubuntu-latest
    needs: [api, web, mcp]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f infra/compose.yml build
      - name: Boot stack and probe
        run: |
          docker compose -f infra/compose.yml up -d --wait postgres redis api
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/readyz
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose.yml logs --no-color
      - name: Teardown
        if: always()
        run: docker compose -f infra/compose.yml down -v

  demo:
    # The hosted demo is one image (ADR-030). Build it, start it and drive the sample receipts to
    # an approved claim through the public port, first by API (smoke.py), then through the browser
    # (the Playwright suite in apps/web/e2e: upload, review, answer, submit, approve, accessibility,
    # phone layout). Every model answer must come from the committed recordings, so this also
    # catches recordings that stop matching on another machine.
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the hosted-demo image
        run: docker build -f deploy/hf-space/Dockerfile --build-arg SOURCE=fetch-local -t claimpilot-demo .
      - name: Start it
        run: |
          docker run -d --name demo -p 7860:7860 claimpilot-demo
          for i in $(seq 1 90); do curl -fsS http://localhost:7860/api/readyz && exit 0; sleep 2; done
          docker logs demo; exit 1
      - name: Drive the sample receipts through it (replay mode, no model calls)
        run: uv run --project services/api python scripts/smoke.py --api http://localhost:7860/api
      - name: Browser tests (Playwright, desktop and phone)
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:7860
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
      - name: Logs on failure
        if: failure()
        run: docker logs demo
      - name: Teardown
        if: always()
        run: docker rm -f demo

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI image directly: the gitleaks-action wrapper errored on the first push
      # (exit 1 with no findings), while the same scan via the image reports "no leaks found".
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --no-banner --redact --exit-code 1
