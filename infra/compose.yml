# Full local stack:  docker compose -f infra/compose.yml up --build
# Includes the mock MCP servers (mcp-finance, mcp-corp). They have no authentication, so their
# host ports are published on 127.0.0.1 only; the api reaches them over the compose network.
name: claimpilot

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://claimpilot:claimpilot@postgres:5432/claimpilot
  REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /data/uploads
  MCP_FINANCE_URL: http://mcp-finance:8101/mcp
  MCP_CORP_URL: http://mcp-corp:8102/mcp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: claimpilot
      POSTGRES_PASSWORD: claimpilot
      POSTGRES_DB: claimpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]  # loopback only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimpilot -d claimpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]  # loopback only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mock enterprise systems (MCP over streamable HTTP). Each image ships its own HEALTHCHECK.
  mcp-finance:
    build: { context: ../services/mcp-finance }
    image: claimpilot-mcp-finance:local
    environment: { FINANCE_DB: /data/finance.db }
    volumes: [finance-data:/data]
    ports: ["127.0.0.1:8101:8101"]  # loopback only: no authentication

  mcp-corp:
    # Context is the repo root: the image bakes in services/api/config/policy.yaml.
    build: { context: .., dockerfile: services/mcp-corp/Dockerfile }
    image: claimpilot-mcp-corp:local
    ports: ["127.0.0.1:8102:8102"]  # loopback only: no authentication

  api:
    build: { context: ../services/api }
    image: claimpilot-api:local
    env_file:
      - path: ../.env
        required: false
    environment: *api-env
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-finance: { condition: service_healthy }
      mcp-corp: { condition: service_healthy }

  worker:
    image: claimpilot-api:local
    command: ["arq", "claimpilot.worker.WorkerSettings"]
    env_file:
      - path: ../.env
        required: false
    environment: *api-env
    volumes: [uploads:/data/uploads]
    healthcheck:
      test: ["CMD", "arq", "--check", "claimpilot.worker.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api: { condition: service_healthy }  # migrations run in the api container first
      redis: { condition: service_healthy }

  # ClaimPilot itself as an MCP server (streamable HTTP; stdio is for local use). It acts as one demo
  # persona and has no authentication: loopback only. It reads no host files unless
  # CLAIMPILOT_UPLOAD_ROOT names a mounted folder. Start it with: --profile mcp up --build mcp-claimpilot
  mcp-claimpilot:
    profiles: ["mcp"]
    build: { context: ../services/mcp-claimpilot }
    image: claimpilot-mcp-claimpilot:local
    environment:
      CLAIMPILOT_API_URL: http://api:8000
      CLAIMPILOT_PERSONA: DEMO-ASHA
    ports: ["127.0.0.1:8103:8103"]  # loopback only: no authentication
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: claimpilot-web:local
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  finance-data:
